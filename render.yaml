services:
  - type: web
    name: charityweb
    env: php
    plan: free
    region: oregon
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
    startCommand: |
      php artisan migrate --force
      php artisan storage:link
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: CharityWeb
      - key: APP_URL
        value: https://charityweb.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: charityweb-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: charityweb-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: charityweb-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: charityweb-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: charityweb-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: MAIL_MAILER
        value: log

databases:
  - name: charityweb-db
    databaseName: charityweb
    user: charityweb
